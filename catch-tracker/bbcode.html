<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catch Tracker — BBCode Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <div class="brand">Catch <span>Tracker</span></div>
    <nav>
        <a href="index.html" data-i18n="nav_rankings">Rankings</a>
        <a href="feed.html" data-i18n="nav_feed">Live Feed</a>
        <a href="maps.html" data-i18n="nav_maps">Maps</a>
        <a href="skins.html" data-i18n="nav_skins">Skins</a>
        <a href="bbcode.html" class="active" data-i18n="nav_bbcode">BBCode</a>
    </nav>
    <button class="lang-toggle" id="lang-toggle" type="button">EN</button>
</header>
<main class="wide">
    <h1 class="maps-title">
        <svg class="maps-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        <span data-i18n="h1_bbcode">BBCode Editor</span>
    </h1>
    <p class="coverage-note" data-i18n="bbcode_note">Runs entirely in your browser — nothing is sent anywhere. Copy the result into your osu! profile/forum post editor.</p>

    <div class="bbcode-toolbar" id="bbcode-toolbar">
        <button type="button" data-tag="b" title="Bold"><b>B</b></button>
        <button type="button" data-tag="i" title="Italic"><i>I</i></button>
        <button type="button" data-tag="u" title="Underline"><u>U</u></button>
        <button type="button" data-tag="s" title="Strikethrough"><s>S</s></button>
        <button type="button" data-tag="color" data-default="red" title="Color">A</button>
        <button type="button" data-tag="size" data-default="150" title="Size">±</button>
        <button type="button" data-tag="centre" title="Centre">↔</button>
        <button type="button" data-tag="heading" title="Heading">H</button>
        <button type="button" data-tag="url" data-default="https://" title="Link">🔗</button>
        <button type="button" data-tag="img" data-default="https://" title="Image">🖼</button>
        <button type="button" data-tag="list" data-block="1" title="List">≡</button>
        <button type="button" data-tag="quote" title="Quote">“”</button>
        <button type="button" data-tag="code" title="Code">{ }</button>
        <button type="button" data-tag="notice" title="Notice">!</button>
        <button type="button" data-tag="spoiler" title="Spoiler">◑</button>
    </div>

    <div class="bbcode-editor">
        <div class="card bbcode-pane">
            <div class="bbcode-pane-head">
                <span data-i18n="bbcode_source">BBCode</span>
                <div style="display:flex;gap:8px">
                    <button type="button" class="pill" id="bbcode-copy" data-i18n="bbcode_copy">Copy BBCode</button>
                    <button type="button" class="pill" id="bbcode-clear" data-i18n="bbcode_clear">Clear</button>
                </div>
            </div>
            <textarea id="bbcode-input" class="bbcode-textarea" spellcheck="false" data-i18n-placeholder="bbcode_placeholder" placeholder="Write your BBCode here…"></textarea>
        </div>
        <div class="card bbcode-pane">
            <div class="bbcode-pane-head"><span data-i18n="bbcode_preview">Preview</span></div>
            <div id="bbcode-preview" class="bbcode-preview"></div>
        </div>
    </div>
</main>
<footer class="site-footer" data-i18n="footer_main">Catch Tracker — a companion site for osu-collection-hanabi. Data via the official osu! API.</footer>
<script src="js/common.js"></script>
<script src="js/render-bbcode.js"></script>
</body>
</html>
