[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Skip the build+deploy entirely when a push only touched docs / mp-bot /
  # READMEs — nothing that ends up in dist/. Saves build credits. See the
  # script for the list of paths that still trigger a build.
  ignore = "node scripts/should-build.mjs"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions."osu-pp"]
  included_files = ["netlify/functions/node_modules/rosu-pp-js/*.wasm"]

# No scheduled functions here any more. This Netlify copy is only the
# rollback for osu.hanabirn.xyz (Cloudflare Workers) and the osu! API relay
# (osu-relay.js), and its crons were still running on their own data and
# credits: the catalog crawler now runs from GitHub Actions, and push /
# community-mappools / wc-mappool run as the Worker's scheduled handler
# (wrangler.jsonc). The *-cron.js files stay, the Worker imports them.

[functions."replay-analyze"]
  included_files = ["netlify/functions/node_modules/rosu-pp-js/*.wasm"]

# Shareable pretty URL for a published gallery collection — rewrite (200) so
# /c/<id> stays in the address bar while collection-share-page.js serves the
# OpenGraph meta (and bounces real browsers to /?c=<id>).
[[redirects]]
  from = "/c/:id"
  to = "/.netlify/functions/collection-share-page?id=:id"
  status = 200

# Pretty path for the gallery RSS feed (netlify/functions/gallery-feed.js).
[[redirects]]
  from = "/gallery.xml"
  to = "/.netlify/functions/gallery-feed"
  status = 200

# Chat room image/GIF attachments — /chat-media/<uuid> streams the stored
# bytes. status=200 rewrite keeps the original path in event.path, and the
# function reads the id from its last segment (the :id -> ?id= query
# substitution was unreliable on this path).
[[redirects]]
  from = "/chat-media/:id"
  to = "/.netlify/functions/chat-media"
  status = 200

# Clean Interactions Endpoint URL for the Discord bot — set this as the
# app's endpoint in the Discord developer portal (discord-interactions.js).
# The rewrite preserves the POST body Discord needs for signature checking.
[[redirects]]
  from = "/discord"
  to = "/.netlify/functions/discord-interactions"
  status = 200

# 舊站導向新家。站已搬到 Cloudflare Workers（osu.hanabirn.xyz），
# 但從這裡安裝過 PWA 或加了書籤的人仍會回到這個網址——而 osu! 的 OAuth
# 只認得一個 callback，現在登記的是新網域，所以舊站的登入必定失敗
# （實測回 invalid_client）。把進到首頁的人送過去。
#
# 只轉首頁，不做 /* 全站轉址：Discord 的互動端點還在這裡服務
# （上面的 /discord 規則，以及它內部呼叫的 discord-work-background），
# 全站轉址會把那條路徑一起吃掉。深層連結留在舊站也仍然可用。
#
# 用 302 而非 301：瀏覽器會把 301 硬快取住，之後想改回來很麻煩。
# 等新站穩定一段時間、確定不需要退回，再換成 301。
[[redirects]]
  from = "/"
  to = "https://osu.hanabirn.xyz/"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "https://osu.hanabirn.xyz/"
  status = 302
  force = true
