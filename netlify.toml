[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions."osu-pp"]
  included_files = ["netlify/functions/node_modules/rosu-pp-js/*.wasm"]

[functions."farm-crawl-cron"]
  schedule = "*/10 * * * *"
  included_files = ["netlify/functions/node_modules/rosu-pp-js/*.wasm"]

# Web Push: re-check every subscriber's tracked players every 30 min and
# send a push when PP moved. Inert until the VAPID_* env vars are set.
[functions."push-cron"]
  schedule = "*/30 * * * *"

# Ranked-catalog metadata crawler (artist / language / genre / source index
# for the Catalog tab) — one search page per loop, all rulesets in one pass,
# see netlify/functions/_catalog-crawl-core.js. Every 30 min: the dataset is
# already ~55k sets and only needs to keep pace with newly-ranked maps now.
[functions."catalog-crawl-cron"]
  schedule = "*/30 * * * *"

# Official World Cup mappool index (OWC / TWC / MWC 4K+7K / CWC, every year),
# parsed from the ppy/osu-wiki markdown — see netlify/functions/_wc-mappools-core.js.
# Weekly: the data is ~annual and hash-compared, so most runs are a no-op.
# Use wc-mappool-crawl-run.js (WC_MAPPOOL_CRAWL_SECRET) to force the initial fill.
[functions."wc-mappool-crawl-cron"]
  schedule = "0 6 * * 1"

[functions."farm-crawl-run"]
  included_files = ["netlify/functions/node_modules/rosu-pp-js/*.wasm"]

[functions."replay-analyze"]
  included_files = ["netlify/functions/node_modules/rosu-pp-js/*.wasm"]

# Shareable pretty URL for a published gallery collection — rewrite (200) so
# /c/<id> stays in the address bar while collection-share-page.js serves the
# OpenGraph meta (and bounces real browsers to /?c=<id>).
[[redirects]]
  from = "/c/:id"
  to = "/.netlify/functions/collection-share-page?id=:id"
  status = 200

# Pretty path for the gallery RSS feed (netlify/functions/gallery-feed.js).
[[redirects]]
  from = "/gallery.xml"
  to = "/.netlify/functions/gallery-feed"
  status = 200

# Chat room image/GIF attachments — /chat-media/<uuid> streams the stored
# bytes. status=200 rewrite keeps the original path in event.path, and the
# function reads the id from its last segment (the :id -> ?id= query
# substitution was unreliable on this path).
[[redirects]]
  from = "/chat-media/:id"
  to = "/.netlify/functions/chat-media"
  status = 200

# Clean Interactions Endpoint URL for the Discord bot — set this as the
# app's endpoint in the Discord developer portal (discord-interactions.js).
# The rewrite preserves the POST body Discord needs for signature checking.
[[redirects]]
  from = "/discord"
  to = "/.netlify/functions/discord-interactions"
  status = 200
